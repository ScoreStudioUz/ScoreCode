name: Build ScoreCode

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v4

      - name: Node.js o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rust o'rnatish
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Ikonka yaratish
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/icons" | Out-Null

          $script = @'
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap(32, 32)
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.Clear([System.Drawing.Color]::FromArgb(255, 137, 180, 250))
          $font = New-Object System.Drawing.Font('Arial', 12, [System.Drawing.FontStyle]::Bold)
          $brush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(255, 30, 30, 46))
          $g.DrawString('S', $font, $brush, 6, 6)
          $bmp.Save('src-tauri/icons/32x32.png')
          $bmp128 = New-Object System.Drawing.Bitmap(128, 128)
          $g2 = [System.Drawing.Graphics]::FromImage($bmp128)
          $g2.Clear([System.Drawing.Color]::FromArgb(255, 137, 180, 250))
          $font2 = New-Object System.Drawing.Font('Arial', 60, [System.Drawing.FontStyle]::Bold)
          $g2.DrawString('S', $font2, $brush, 20, 20)
          $bmp128.Save('src-tauri/icons/128x128.png')
          $ico = [System.Drawing.Icon]::FromHandle($bmp.GetHicon())
          $stream = [System.IO.FileStream]::new('src-tauri/icons/icon.ico', [System.IO.FileMode]::Create)
          $ico.Save($stream)
          $stream.Close()
          '@

          Set-Content -Path "icon.ps1" -Value $script
          powershell -NoProfile -File "icon.ps1"

      - name: npm dependencies
        run: npm install

      - name: Tauri build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: ScoreCode v__VERSION__
          releaseBody: "ScoreCode yangi versiyasi"
          releaseDraft: false
          prerelease: false
