[package]
name = "scoreedit"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "1.6", features = [
  "dialog-open",
  "fs-read-file",
  "fs-write-file",
  "fs-read-dir",
  "window-close",
  "window-minimize",
  "window-maximize",
  "window-unmaximize"
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
