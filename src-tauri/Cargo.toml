[package]
name = "scorecode"
version = "0.3.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = [
  "dialog-open",
  "dialog-save",
  "fs-read-file",
  "fs-write-file",
  "fs-read-dir",
  "fs-create-dir",
  "fs-remove-dir",
  "fs-remove-file",
  "fs-rename-file",
  "fs-exists",
  "clipboard-write-text",
  "clipboard-read-text",
  "shell-open",
  "window-close",
  "window-minimize",
  "window-maximize",
  "window-unmaximize",
  "window-set-title"
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6.1"
walkdir = "2.4"
dirs = "5.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
