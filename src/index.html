<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScoreCode</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Title Bar -->
  <div class="titlebar" data-tauri-drag-region>
    <div class="titlebar-dots">
      <span class="dot dot-red" id="btn-close" title="Закрыть"></span>
      <span class="dot dot-yellow" id="btn-minimize" title="Свернуть"></span>
      <span class="dot dot-green" id="btn-maximize" title="Развернуть"></span>
    </div>
    <span class="titlebar-title" id="titlebar-title">ScoreEdit</span>
    <div class="titlebar-spacer"></div>
  </div>

  <!-- App Body -->
  <div class="app">

    <!-- Activity Bar (левая иконки) -->
    <div class="activity-bar">
      <button class="activity-btn active" id="act-explorer" title="Файлы">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/></svg>
      </button>
      <button class="activity-btn" id="act-search" title="Поиск">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
      </button>
      <button class="activity-btn" id="act-settings" title="Настройки">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      </button>
    </div>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <!-- Explorer Panel -->
      <div class="panel" id="panel-explorer">
        <div class="panel-header">
          <span class="panel-title">ПРОВОДНИК</span>
          <div class="panel-actions">
            <button class="panel-btn" id="btn-new-file" title="Новый файл">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
            </button>
            <button class="panel-btn" id="btn-new-folder" title="Новая папка">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 2h9a2 2 0 012 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
            </button>
            <button class="panel-btn" id="btn-open-folder" title="Открыть папку">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 2h9a2 2 0 012 2z"/></svg>
            </button>
          </div>
        </div>
        <div class="file-tree" id="file-tree">
          <div class="tree-empty" id="tree-empty">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 2h9a2 2 0 012 2z"/></svg>
            <p id="tree-empty-text">Папка не открыта</p>
            <button class="btn-open" id="btn-open-folder2" data-i18n="welcomeOpen">Открыть папку</button>
          </div>
        </div>
      </div>

      <!-- Search Panel -->
      <div class="panel hidden" id="panel-search">
        <div class="panel-header">
          <span class="panel-title">ПОИСК</span>
        </div>
        <div class="search-box">
          <input type="text" id="search-input" placeholder="Найти в файлах..." />
          <div id="search-results"></div>
        </div>
      </div>

      <!-- Settings Panel -->
      <div class="panel hidden" id="panel-settings">
        <div class="panel-header">
          <span class="panel-title" data-i18n="settings">НАСТРОЙКИ</span>
        </div>
        <div class="settings-list">
          <label class="setting-item">
            <span data-i18n="fontSize">Размер шрифта</span>
            <div class="stepper">
              <button class="stepper-btn" type="button" data-stepper="fontSize" data-step="-1">−</button>
              <input type="number" id="set-fontsize" value="14" min="10" max="24" />
              <button class="stepper-btn" type="button" data-stepper="fontSize" data-step="1">+</button>
            </div>
          </label>
          <label class="setting-item">
            <span data-i18n="tabSize">Табуляция</span>
            <div class="stepper">
              <button class="stepper-btn" type="button" data-stepper="tabSize" data-step="-1">−</button>
              <input type="number" id="set-tabsize" value="4" min="2" max="8" />
              <button class="stepper-btn" type="button" data-stepper="tabSize" data-step="1">+</button>
            </div>
          </label>
          <label class="setting-item">
            <span data-i18n="wordWrap">Перенос строк</span>
            <input type="checkbox" id="set-wordwrap" />
          </label>
          <label class="setting-item">
            <span data-i18n="theme">Тема</span>
            <button class="theme-pill" type="button" id="theme-trigger">
              <span id="theme-trigger-label">Default</span>
            </button>
          </label>
          <div class="theme-popover hidden" id="theme-popover">
            <button class="theme-option" type="button" data-theme-option="default">Default</button>
            <button class="theme-option" type="button" data-theme-option="custom">Custom</button>
            <div class="custom-theme-controls hidden" id="custom-theme-controls">
              <label>
                <span>Base</span>
                <input type="color" id="custom-base-color" value="#111827" />
              </label>
              <label>
                <span>Text</span>
                <input type="color" id="custom-text-color" value="#f8fafc" />
              </label>
              <label>
                <span>Accent</span>
                <input type="color" id="custom-accent-color" value="#38bdf8" />
              </label>
            </div>
          </div>
          <label class="setting-item">
            <span data-i18n="language">Язык</span>
            <select id="set-language">
              <option value="ru">Русский</option>
              <option value="en">English</option>
            </select>
          </label>
        </div>
      </div>
    </div>

    <!-- Resize Handle -->
    <div class="resize-handle" id="resize-handle"></div>

    <!-- Editor Area -->
    <div class="editor-area">
      <!-- Tabs Bar -->
      <div class="tabs-bar" id="tabs-bar">
        <div class="tabs-list" id="tabs-list"></div>
        <div class="tabs-actions">
          <button class="tab-action-btn" id="btn-save" title="Сохранить (Ctrl+S)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          </button>
        </div>
      </div>

      <!-- Editor + No tabs welcome -->
      <div class="editor-wrapper" id="editor-wrapper">
        <!-- Welcome screen -->
        <div class="welcome" id="welcome">
          <div class="welcome-content">
            <div class="welcome-logo">SE</div>
            <h1>ScoreCode</h1>
            <p id="welcome-message" data-i18n="welcomeTitle">Лёгкий редактор кода</p>
            <div class="welcome-actions">
              <button class="welcome-btn" id="btn-open-folder3" data-i18n="welcomeOpen">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 2h9a2 2 0 012 2z"/></svg>
                Открыть папку
              </button>
              <button class="welcome-btn" id="btn-new-file2" data-i18n="welcomeNewFile">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                Новый файл
              </button>
            </div>
            <div class="welcome-shortcuts">
              <div class="shortcut"><kbd>Ctrl+S</kbd><span data-i18n-shortcut="save">Сохранить</span></div>
              <div class="shortcut"><kbd>Ctrl+W</kbd><span data-i18n-shortcut="close">Закрыть вкладку</span></div>
              <div class="shortcut"><kbd>Ctrl+Tab</kbd><span data-i18n-shortcut="next">Следующая вкладка</span></div>
            </div>
          </div>
        </div>

        <!-- Code Editor -->
        <div class="editor-container hidden" id="editor-container">
          <div class="editor-gutter" id="editor-gutter"></div>
          <textarea class="editor-textarea" id="editor-textarea" spellcheck="false" autocorrect="off" autocapitalize="off"></textarea>
        </div>
      </div>

      <!-- Status Bar -->
      <div class="status-bar">
        <div class="status-left">
          <span class="status-item status-branch">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="6" y1="3" x2="6" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 01-9 9"/></svg>
            <span id="status-branch">main</span>
          </span>
          <span class="status-item" id="status-errors">✓ Нет ошибок</span>
        </div>
        <div class="status-right">
          <span class="status-item" id="status-lang">Текст</span>
          <span class="status-item" id="status-cursor">Стр 1, Кол 1</span>
          <span class="status-item" id="status-encoding">UTF-8</span>
        </div>
      </div>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
